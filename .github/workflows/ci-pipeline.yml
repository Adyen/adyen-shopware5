name: CI Pipeline Shopware 5
on:
  push:
    branches: [ "master", "develop" ]

permissions:
  contents: read

jobs:
  build:
    name: Build environment
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 7.4
          tools: composer:2
          coverage: none

      - name: Validate and audit Composer dependencies
        run: |
          composer validate --strict --no-check-all --no-check-publish
          composer audit --locked

      - name: Create Cache Directories
        run: mkdir -p ~/.build

      - name: Mount Build Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cache-plugin-${{ github.run_id }}
          path: ~/.build

      - name: Build Plugin
        uses: ./.github/actions/build_plugin
        env:
          # Read-only job token, scoped to this step only. The Composer packages are public;
          # the token just lifts the anonymous GitHub API rate limit for the locked dist downloads.
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

  run:
    name: E2E | Shopware ${{ matrix.shopware }}, PHP ${{ matrix.php }}, Browser ${{matrix.browser}}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The E2E job receives live Adyen and PayPal credentials. Protect this environment with
    # required reviewers in the repository settings so unreviewed pushes cannot use them.
    environment: e2e
    strategy:
      fail-fast: false
      matrix:
        include:
          - shopware: '5.6.10'
            php: '7.4'
            port: 443
            browser: 'chromium'
            device: 'Desktop Chrome'
          - shopware: '5.7.18'
            php: '7.4'
            port: 443
            browser: 'firefox'
            device: 'Desktop Firefox'
          - shopware: '5.7.8'
            php: '8.1'
            port: 443
            browser: 'chromium'
            device: 'Desktop Chrome'
#
#          - shopware: '5.6.10'
#            php: '7.4'
#            port: 443
#            browser: 'firefox'
#            device: 'Desktop Firefox'
#          - shopware: '5.7.18'
#            php: '7.4'
#            port: 443
#            browser: 'firefox'
#            device: 'Desktop Firefox'
#          - shopware: '5.7.8'
#            php: '8.1'
#            port: 443
#            browser: 'firefox'
#            device: 'Desktop Firefox'
    steps:
      - name: Clone Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: main
          persist-credentials: false

      - name: Mount Build Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cache-plugin-${{ github.run_id }}
          path: ~/.build

      - name: E2E Tests, Shopware ${{ matrix.shopware }}
        uses: ./main/.github/actions/run_e2e
        with:
          SHOPWARE: ${{ matrix.shopware }}
          PHP: ${{ matrix.php }}
          NODE: 20
          PORT: ${{ matrix.port }}
          NGROK: ${{ secrets.NGROK }}
          GH_PAT: ${{ secrets.GH_PAT }}
          API_KEY_TEST: ${{ secrets.API_KEY_TEST }}
          API_KEY_LIVE: ${{ secrets.API_KEY_LIVE }}
          MERCHANT_ACCOUNT_TEST: ${{ secrets.MERCHANT_ACCOUNT_TEST }}
          MERCHANT_ACCOUNT_LIVE: ${{ secrets.MERCHANT_ACCOUNT_LIVE }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SHOPWARE_TEST_REPO: ${{secrets.SHOPWARE_TEST_REPO}}
          COMMON_TEST_REPO: ${{secrets.COMMON_TEST_REPO}}
          PAY_PAL_EMAIL: ${{secrets.PAY_PAL_EMAIL}}
          PAY_PAL_PASSWORD: ${{secrets.PAY_PAL_PASSWORD}}
          BROWSER: ${{ matrix.browser }}
          DEVICE: ${{ matrix.device }}
